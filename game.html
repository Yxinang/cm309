<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>309 歡樂遊樂場與獎品兌換</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Canvas Confetti CDN (慶祝特效) -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Noto+Sans+TC:wght@500;700&display=swap');
        body { font-family: 'Fredoka', 'Noto Sans TC', sans-serif; background-color: #f0fdf4; }
        .coupon-used {
            background-color: #fef08a !important;
            border-color: #eab308 !important;
            box-shadow: 0 0 10px rgba(234, 179, 8, 0.4);
        }
    </style>
</head>
<body class="min-h-screen text-gray-800 flex flex-col items-center p-4">

    <!-- 頂部導覽列 -->
    <header class="w-full max-w-4xl bg-white shadow-md rounded-2xl p-4 mb-6 flex flex-wrap justify-between items-center border-4 border-emerald-300">
        <div class="flex items-center space-x-3 mb-2 sm:mb-0">
            <span class="text-3xl">🐱</span>
            <h1 class="text-2xl font-bold text-emerald-600">309 班級獎品兌換中心</h1>
        </div>
        <div class="flex flex-wrap items-center gap-3">
            <div class="flex items-center space-x-2 bg-emerald-50 px-3 py-1.5 rounded-xl border-2 border-emerald-200">
                <label for="studentSelect" class="font-bold text-sm text-emerald-700">座號：</label>
                <select id="studentSelect" onchange="switchStudent()" class="bg-white border border-emerald-300 rounded-lg px-2 py-1 font-bold text-emerald-800 focus:outline-none">
                    <!-- 動態載入座號 -->
                </select>
            </div>
            <div class="bg-amber-100 border-2 border-amber-300 px-4 py-1.5 rounded-xl flex items-center space-x-1 shadow-inner">
                <span class="text-xl">🪙</span>
                <span class="text-sm font-bold text-amber-800">可用代幣(動物數)：</span>
                <span id="studentCoins" class="text-lg font-black text-amber-600">0</span>
            </div>
        </div>
    </header>

    <!-- 主要功能區塊 -->
    <main class="w-full max-w-4xl bg-white shadow-xl rounded-3xl p-6 border-4 border-emerald-200 mb-8">
        
        <div class="flex justify-between items-center mb-6">
            <a href="index.html" class="inline-block bg-emerald-100 hover:bg-emerald-200 text-emerald-800 font-bold px-4 py-2 rounded-xl text-sm transition-all">⬅️ 返回班級管理主頁</a>
            <h2 class="text-xl font-bold text-emerald-700">🛍️ 獎品兌換專區</h2>
        </div>
        
        <p class="text-gray-500 mb-6 text-center">動物園每擁有 1 隻成體動物即等於 1 個代幣，請在下方選擇您想兌換的獎品！</p>
        
        <!-- 學生詳細資訊卡片 -->
        <div class="bg-gradient-to-r from-emerald-50 to-teal-50 border-2 border-emerald-300 rounded-2xl p-5 mb-8 shadow-sm flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-4">
                <div class="text-4xl bg-white p-3 rounded-2xl shadow-inner border border-emerald-200">🧑‍🎓</div>
                <div>
                    <div id="infoStudentName" class="text-xl font-bold text-emerald-900">載入中...</div>
                    <div class="text-sm text-emerald-700 mt-0.5">代幣計算：動物園成體動物總數 = 可用代幣</div>
                </div>
            </div>
            <div class="flex gap-3 text-center">
                <div class="bg-white px-4 py-2 rounded-xl border border-emerald-200 shadow-sm">
                    <div class="text-xs text-gray-500 font-bold">成體動物數</div>
                    <div id="infoPets" class="text-lg font-black text-indigo-600">0 隻</div>
                </div>
                <div class="bg-white px-4 py-2 rounded-xl border border-amber-200 shadow-sm">
                    <div class="text-xs text-gray-500 font-bold">可用代幣</div>
                    <div id="infoCoins" class="text-lg font-black text-amber-600">0 枚</div>
                </div>
            </div>
        </div>

        <!-- 獎品兌換選項網格 -->
        <h3 class="text-xl font-bold text-emerald-700 mb-4">🎁 點擊下方項目進行兌換</h3>
        <div id="shopList" class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-8"></div>

        <!-- 兌換成功紀錄區 -->
        <h3 class="text-xl font-bold text-emerald-700 mb-3">🎟️ 已兌換獎品紀錄區</h3>
        <p class="text-xs text-gray-500 mb-3">💡 顯示兌換時間、花費點數與獎品內容，點擊卡片可標記已領取！</p>
        <div id="directCouponsArea" class="bg-emerald-50/60 border-2 border-dashed border-emerald-300 rounded-2xl p-4 min-h-[110px] flex flex-wrap gap-3 mb-8"></div>

    </main>

    <!-- 得獎特效 Modal -->
    <div id="rewardPopupModal" class="fixed inset-0 bg-black/60 hidden flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-3xl p-8 max-w-sm w-full border-4 border-amber-400 text-center shadow-2xl">
            <div class="text-6xl mb-3">🎉</div>
            <h3 class="text-2xl font-black text-emerald-700 mb-2">兌換成功！</h3>
            <div id="rewardPopupContent" class="text-xl font-bold text-amber-600 bg-amber-50 border-2 border-amber-200 rounded-2xl py-4 px-2 my-4 shadow-inner">
                獎品名稱
            </div>
            <button onclick="closeRewardPopup()" class="bg-emerald-500 hover:bg-emerald-600 text-white font-black text-lg px-6 py-3 rounded-2xl shadow-md w-full transition-all">太棒了！收下</button>
        </div>
    </div>

    <!-- 兌換輸入名稱專屬 Modal (只需輸入獎品內容) -->
    <div id="customPrizeModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl p-6 max-w-sm w-full border-4 border-emerald-300 text-center">
            <h3 id="modalTitle" class="text-lg font-bold text-emerald-800 mb-2">🎁 獎品兌換</h3>
            <p class="text-sm text-gray-500 mb-4">請輸入您想要兌換的獎品內容：</p>
            <input type="text" id="customPrizeInput" placeholder="例如: 貼紙、小禮物..." class="w-full border-2 border-emerald-300 rounded-xl px-3 py-2 text-center font-bold text-emerald-800 mb-4 focus:outline-none">
            <div class="flex space-x-2">
                <button onclick="confirmCustomBuy()" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold px-4 py-2 rounded-xl flex-1 shadow">確認兌換</button>
                <button onclick="closeCustomModal()" class="bg-gray-300 hover:bg-gray-400 text-gray-700 font-bold px-4 py-2 rounded-xl">取消</button>
            </div>
        </div>
    </div>

    <!-- 標記已領取 Modal -->
    <div id="couponModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl p-6 max-w-sm w-full border-4 border-emerald-300 text-center">
            <h3 class="text-lg font-bold text-emerald-800 mb-2">🎟️ 標記已領取狀態</h3>
            <p class="text-sm text-gray-500 mb-4">確認是否將此獎品標記為已領取？</p>
            <div class="flex space-x-2">
                <button onclick="confirmCouponModal()" class="bg-amber-500 hover:bg-amber-600 text-white font-bold px-4 py-2 rounded-xl flex-1 shadow">確認已領取</button>
                <button onclick="closeCouponModal()" class="bg-gray-300 hover:bg-gray-400 text-gray-700 font-bold px-4 py-2 rounded-xl">關閉</button>
            </div>
        </div>
    </div>

    <!-- JavaScript 邏輯 -->
    <script>
        const DEFAULT_STUDENTS = [
            "1號", "2號", "3號", "4號", "5號", "6號", "7號", "8號", "9號", "10號",
            "11號", "12號", "13號", "14號", "15號", "16號", "17號", "18號", "19號", "20號",
            "21號", "22號", "23號", "24號", "25號", "26號（測試用）"
        ];

        let storedStudents = JSON.parse(localStorage.getItem('cm309_students'));
        let students = (storedStudents && storedStudents.length > 0) ? storedStudents : DEFAULT_STUDENTS;

        let gameData = {};
        let currentSeatIndex = 0; 
        let firebaseDbUrl = localStorage.getItem('cm309_firebase_url') || "";
        let activeCouponIndex = null;

        window.addEventListener('DOMContentLoaded', () => {
            initApp();
            if (firebaseDbUrl) {
                fetchFromFirebase();
            }
        });

        function initApp() {
            let select = document.getElementById('studentSelect');
            select.innerHTML = '';
            students.forEach((name, index) => {
                let opt = document.createElement('option');
                opt.value = index;
                opt.textContent = name;
                select.appendChild(opt);
            });
            getStudentGameData(getCurrentSeatNum());
            updateView();
        }

        function getCurrentSeatNum() {
            return currentSeatIndex + 1; 
        }

        function getStudentGameData(seatNum) {
            gameData = JSON.parse(localStorage.getItem('cm309_game_data')) || {};
            if (!gameData[seatNum]) {
                gameData[seatNum] = { directCoupons: [] };
            }
            if (!gameData[seatNum].directCoupons) gameData[seatNum].directCoupons = [];
            return gameData[seatNum];
        }

        function switchStudent() {
            currentSeatIndex = parseInt(document.getElementById('studentSelect').value);
            getStudentGameData(getCurrentSeatNum());
            updateView();
        }

        // 💡 抓取動物園內「尚未兌換」的成體動物總數作為代幣
        function getTotalCoins(seatNum) {
            let petCollection = JSON.parse(localStorage.getItem('cm309_pet_collection')) || {};
            let myPets = petCollection[seatNum] || [];
            return myPets.filter(p => !p.redeemed).length;
        }

        // 💡 扣除動物園內的成體動物（每花 1 代幣 = 消耗 1 隻成體動物標記為 redeemed）
        function deductAnimalCoins(cost) {
            let seatNum = getCurrentSeatNum();
            let availableCoins = getTotalCoins(seatNum);
            if (availableCoins < cost) return false;

            let petCollection = JSON.parse(localStorage.getItem('cm309_pet_collection')) || {};
            let myPets = petCollection[seatNum] || [];
            let available = myPets.filter(p => !p.redeemed);

            let redeemedCount = 0;
            for (let p of available) {
                if (redeemedCount < cost) {
                    p.redeemed = true;
                    p.prize = "代幣兌換扣除";
                    redeemedCount++;
                }
            }

            petCollection[seatNum] = myPets;
            localStorage.setItem('cm309_pet_collection', JSON.stringify(petCollection));
            syncToFirebase();
            return true;
        }

        function saveGameData() {
            let seatNum = getCurrentSeatNum();
            gameData[seatNum] = getStudentGameData(seatNum);
            localStorage.setItem('cm309_game_data', JSON.stringify(gameData));
            syncToFirebase();
        }

        function updateView() {
            let seatNum = getCurrentSeatNum();
            let studentName = students[currentSeatIndex] || `${seatNum}號`;
            let totalCoins = getTotalCoins(seatNum);

            document.getElementById('studentCoins').textContent = totalCoins;
            document.getElementById('infoStudentName').textContent = studentName;
            document.getElementById('infoPets').textContent = totalCoins + " 隻";
            document.getElementById('infoCoins').textContent = totalCoins + " 枚";

            let gData = getStudentGameData(seatNum);
            renderShop(totalCoins);
            renderCoupons(gData.directCoupons);
        }

        function switchTab(tabName) {
            // 保留單一標籤切換
        }

        function showRewardPopup(prizeName) {
            document.getElementById('rewardPopupContent').textContent = prizeName;
            document.getElementById('rewardPopupModal').classList.remove('hidden');
            confetti({ particleCount: 150, spread: 100, origin: { y: 0.5 } });
        }

        function closeRewardPopup() {
            document.getElementById('rewardPopupModal').classList.add('hidden');
        }

        // 💡 獎品兌換清單渲染 (紫點5、藍點10、綠點15、紅點25、作業減免30、免抄聯絡簿40、指定座位50)
        function renderShop(totalCoins) {
            let container = document.getElementById('shopList');
            container.innerHTML = '';
            
            const shopItems = [
                { id: 'purple_prize', name: "紫點獎勵", cost: 5, icon: "🟣" },
                { id: 'blue_prize', name: "藍點獎勵", cost: 10, icon: "🔵" },
                { id: 'green_prize', name: "綠點獎勵", cost: 15, icon: "🌟" },
                { id: 'red_prize', name: "紅點大獎", cost: 25, icon: "👑" },
                { id: 'hw', name: "作業減免", cost: 30, icon: "✂️" },
                { id: 'book', name: "免抄聯絡簿 3 天", cost: 40, icon: "📝" },
                { id: 'seat', name: "指定座位", cost: 50, icon: "🪑" }
            ];

            shopItems.forEach(item => {
                let canBuy = totalCoins >= item.cost;
                let div = document.createElement('div');
                div.className = `flex items-center justify-between p-4 rounded-2xl border-2 shadow-sm ${canBuy ? 'bg-emerald-50 border-emerald-200' : 'bg-gray-50 border-gray-200 opacity-60'}`;
                div.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <span class="text-3xl">${item.icon}</span>
                        <div>
                            <div class="font-bold text-gray-800">${item.name}</div>
                            <div class="text-sm text-amber-600 font-bold">需代幣：${item.cost} 枚</div>
                        </div>
                    </div>
                    <button onclick="handleBuy('${item.id}', '${item.name}', ${item.cost})" ${canBuy ? '' : 'disabled'} class="${canBuy ? 'bg-emerald-500 hover:bg-emerald-600 text-white cursor-pointer' : 'bg-gray-300 text-gray-500 cursor-not-allowed'} font-bold px-4 py-2 rounded-xl shadow transition-all">兌換</button>
                `;
                container.appendChild(div);
            });
        }

        function handleBuy(itemId, itemName, cost) {
            let seatNum = getCurrentSeatNum();
            let total = getTotalCoins(seatNum);

            if (total < cost) {
                alert(`您的代幣總數 (${total}枚) 不夠兌換【${itemName}】(需 ${cost}枚) 喔！`);
                return;
            }

            // 所有獎品按下後皆可自訂輸入獎品內容
            document.getElementById('customPrizeModal').classList.remove('hidden');
            document.getElementById('customPrizeInput').value = '';
            document.getElementById('customPrizeInput').dataset.prizeType = itemName;
            document.getElementById('customPrizeInput').dataset.cost = cost;
            document.getElementById('modalTitle').textContent = `🎁 兌換 ${itemName} (需 ${cost} 代幣)`;
            setTimeout(() => document.getElementById('customPrizeInput').focus(), 100);
        }

        function closeCustomModal() {
            document.getElementById('customPrizeModal').classList.add('hidden');
        }

        function confirmCustomBuy() {
            let customContent = document.getElementById('customPrizeInput').value.trim();
            let prizeType = document.getElementById('customPrizeInput').dataset.prizeType || "獎品";
            let cost = parseInt(document.getElementById('customPrizeInput').dataset.cost || 5);
            
            if (!customContent) {
                alert('請輸入獎品內容！');
                return;
            }
            closeCustomModal();
            executeBuy(`${prizeType}：${customContent}`, cost);
        }

        // 💡 執行代幣扣除與下方紀錄累計
        function executeBuy(fullPrizeName, cost) {
            let success = deductAnimalCoins(cost);
            if (!success) {
                alert('代幣（成體動物）不足，扣款失敗！');
                return;
            }

            let seatNum = getCurrentSeatNum();
            let gData = getStudentGameData(seatNum);
            
            let nowTimeStr = new Date().toLocaleString('zh-TW', { hour12: false, month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });

            // 推進下方兌換區紀錄
            gData.directCoupons.push({ 
                name: fullPrizeName, 
                cost: cost, 
                date: nowTimeStr, 
                isUsed: false 
            });

            saveGameData();
            showRewardPopup(fullPrizeName);
            updateView();
        }

        // 💡 渲染下方兌換紀錄區 (顯示兌換時間、花費點數、獎品內容)
        function renderCoupons(couponsArray) {
            let container = document.getElementById('directCouponsArea');
            container.innerHTML = '';

            if (!couponsArray || couponsArray.length === 0) {
                container.innerHTML = '<span class="text-gray-400 text-sm">目前尚無兌換紀錄。</span>';
                return;
            }

            let sorted = [...couponsArray].sort((a, b) => {
                let aUsed = !!a.isUsed ? 1 : 0;
                let bUsed = !!b.isUsed ? 1 : 0;
                return aUsed - bUsed;
            });

            sorted.forEach((item) => {
                let originalIndex = couponsArray.indexOf(item);
                let isUsed = !!item.isUsed;
                let badge = document.createElement('div');
                badge.className = `relative border-2 rounded-xl p-3 shadow-sm flex flex-col items-start transition-all cursor-pointer ${isUsed ? 'coupon-used border-yellow-400' : 'bg-white border-emerald-300'}`;
                
                badge.innerHTML = `
                    <button onclick="event.stopPropagation(); deleteCoupon(${originalIndex})" class="absolute top-2 right-2 text-red-400 hover:text-red-600 font-bold text-xs bg-white/80 px-1.5 py-0.5 rounded-full border border-red-200">✕ 刪除</button>
                    <span class="font-bold text-emerald-700 text-sm pr-12">🎁 ${item.name}</span>
                    <div class="flex justify-between items-center w-full mt-2 gap-4">
                        <span class="text-[11px] text-gray-600 font-bold">⏱️ 兌換時間：${item.date} ｜ 💰 花費：${item.cost} 代幣</span>
                        <span class="text-[11px] font-bold px-2.5 py-0.5 rounded-full ${isUsed ? 'bg-amber-200 text-amber-800' : 'bg-gray-100 text-gray-500'}">
                            ${isUsed ? '🟡 已領取' : '⚪ 未領取(點我標記)'}
                        </span>
                    </div>
                `;

                badge.onclick = () => {
                    activeCouponIndex = originalIndex;
                    document.getElementById('couponModal').classList.add('active');
                };

                container.appendChild(badge);
            });
        }

        function closeCouponModal() {
            document.getElementById('couponModal').classList.remove('active');
            activeCouponIndex = null;
        }

        function confirmCouponModal() {
            if (activeCouponIndex !== null) {
                let seatNum = getCurrentSeatNum();
                let gData = getStudentGameData(seatNum);
                if (gData.directCoupons[activeCouponIndex]) {
                    gData.directCoupons[activeCouponIndex].isUsed = true;
                    saveGameData();
                    closeCouponModal();
                    updateView();
                    alert(`✅ 已成功標記為已領取！`);
                }
            }
        }

        function deleteCoupon(index) {
            let seatNum = getCurrentSeatNum();
            let gData = getStudentGameData(seatNum);
            if (confirm("確定要刪除這筆兌換紀錄嗎？")) {
                gData.directCoupons.splice(index, 1);
                saveGameData();
                updateView();
            }
        }

        function fetchFromFirebase() {
            if (!firebaseDbUrl) return;
            fetch(`${firebaseDbUrl.trim().endsWith('/') ? firebaseDbUrl.trim().slice(0, -1) : firebaseDbUrl.trim()}/classroomData.json`)
                .then(res => res.json())
                .then(data => {
                    if (data) {
                        if (data.students && data.students.length > 0) {
                            students = data.students;
                            localStorage.setItem('cm309_students', JSON.stringify(students));
                        }
                        if (data.petCollection) {
                            localStorage.setItem('cm309_pet_collection', JSON.stringify(data.petCollection));
                        }
                        if (data.gameData) {
                            localStorage.setItem('cm309_game_data', JSON.stringify(data.gameData));
                            gameData = data.gameData;
                        }
                        initApp();
                    }
                })
                .catch(err => console.error("Firebase 讀取失敗:", err));
        }

        function syncToFirebase() {
            if (!firebaseDbUrl) return;
            let petCollection = JSON.parse(localStorage.getItem('cm309_pet_collection')) || {};
            let payload = {
                students: students,
                gameData: JSON.parse(localStorage.getItem('cm309_game_data')) || {},
                petCollection: petCollection
            };
            fetch(`${firebaseDbUrl.trim().endsWith('/') ? firebaseDbUrl.trim().slice(0, -1) : firebaseDbUrl.trim()}/classroomData.json`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).catch(err => console.error("Firebase 同步失敗:", err));
        }
    </script>
</body>
</html>
